<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Log in to your Golden Batch Cookie Co. account to manage your profile, view orders, and access your account information.">
    <meta name="author" content="Golden Batch Cookie Co.">

    <title>Golden Batch Cookie Co. | Account Login Page</title>

    <link rel="canonical" href="https://www.goldenbatchcookies.com/account-login.html">
    
    <link rel="stylesheet" type="text/css" href="css/account-login.css">
    <link rel="stylesheet" type="text/css" href="css/user-greeting.css">
    <link rel="stylesheet" type="text/css" href="css/cart-status.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="js/auth.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/account-login.js" defer></script>
    <script src="js/user-greeting.js" defer></script>
    <script src="js/user-status.js" defer></script>
    <script src="js/cart-status.js" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="img-logo" src="images/Company-Logo-Color.png" alt="Golden Batch Cookie Co. logo">

            <!-- User Greeting for logged-in users -->
            <div id="user-greeting">
                <span class="user-name"></span>
                <div class="user-links">
                    <a href="index.html" id="logout">Logout</a>
                </div>
            </div>

            <ul class="nav-links" aria-label="Main navigation">
                <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li>
                    <a id="order-online-link" href="order.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                            Order

                        <span id="cart-count-badge" class="cart-count-badge">
                            0
                        </span>
                    </a>
                </li>
                <li><a href="catering.html"><i class="fa-solid fa-utensils"></i>Catering</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i>About</a></li>
                <li id="account-login-item"><a href="account-login.html"><i class="fa-solid fa-circle-user"></i>Login</a></li>
                <li id="account-profile-item"><a href="account-profile.html"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
                <li><a href="reviews.html"><i class="fa-solid fa-star"></i>Customer Reviews</a></li>
            </ul>

            <div class="connect">
                <p>Connect with us</p>
                <ul class="social-links">
                    <li>
                        <a
                            href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Facebook"
                        >
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    
                    <li>
                        <a
                            href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Instagram"
                        >
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://twitter.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Twitter"
                        >
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://www.pinterest.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Pinterest"
                        >
                            <i class="fa-brands fa-pinterest"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main-content" role="main">
            <section class="login-section">
                <h1 class="login-title">Login</h1>
                <p class="login-instruction">Enter your email and password to access your account:</p>

                <form id="login-form" class="login-form" novalidate>
                    <!-- Email field -->
                    <div class="form-group">
                        <label for="email" class="visually-hidden">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="E-mail"
                            required
                        >
                    </div>

                    <!-- Password field -->
                    <div class="form-group">
                        <label for="password" class="visually-hidden">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Password" 
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <!-- Submit button -->
                    <button type="submit" class="btn btn-login">Login</button>

                    <!-- Signup link -->
                    <p class="signup-prompt">
                        Don't have an account? <a href="register.html">Sign Up</a>
                    </p>

                    <!-- Forgot login link -->
                    <a href="forgot-password.html" id="forgot-password">Forgot Password?</a>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
