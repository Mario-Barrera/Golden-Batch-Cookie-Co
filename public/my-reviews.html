<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your Golden Batch Cookie Co. customer reviews.">

    <title>My Reviews | Golden Batch Cookie Co.</title>

    <!-- Prevent search engines from indexing this private account page or following its links. -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" type="text/css" href="css/my-reviews.css">
    <link rel="stylesheet" type="text/css" href="css/user-greeting.css">
    <link rel="stylesheet" type="text/css" href="css/cart-status.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="js/auth.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/user-greeting.js" defer></script>
    <script src="js/user-status.js" defer></script>
    <script src="js/cart-status.js" defer></script>
    <script src="js/my-reviews.js" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="img-logo" src="images/Company-Logo-Color.png" alt="Golden Batch Cookie Co. logo">

            <!-- User Greeting for logged-in users -->
            <div id="user-greeting">
                <span class="user-name"></span>
                <div class="user-links">
                    <a href="index.html" id="logout">Logout</a>
                </div>
            </div>

            <ul class="nav-links" aria-label="Main navigation">
                <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li>
                    <a id="order-online-link" href="order.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                            Order

                        <span id="cart-count-badge" class="cart-count-badge">
                            0
                        </span>
                    </a>
                </li>
                <li><a href="catering.html"><i class="fa-solid fa-utensils"></i>Catering</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i>About</a></li>
                <li id="account-login-item"><a href="account-login.html"><i class="fa-solid fa-circle-user"></i>Login</a></li>
                <li id="account-profile-item"><a href="account-profile.html"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
                <li><a href="reviews.html"><i class="fa-solid fa-star"></i>Customer Reviews</a></li>
            </ul>

            <div class="connect">
                <p>Connect with us</p>
                <ul class="social-links">
                    <li>
                        <a
                            href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Facebook"
                        >
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    
                    <li>
                        <a
                            href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Instagram"
                        >
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://twitter.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Twitter"
                        >
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://www.pinterest.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Pinterest"
                        >
                            <i class="fa-brands fa-pinterest"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>    

        <main class="my-reviews-main">
            <section class="my-reviews-section">
                <div class="my-reviews-header">
                    <div>
                        <h1>My Reviews</h1>
                        <p>
                            View, edit, or delete reviews you have submitted.
                        </p>
                    </div>
                    <a href="review-form.html" class="btn-link" >
                        Write a New Review
                    </a>
                </div>

                <!-- JavaScript will place the customer's reviews inside this container. -->
                <div id="my-reviews-container" class="my-reviews-container">
                </div>

                <!-- Displayed when the customer has not submitted any reviews. -->
                <div id="no-reviews-message" class="no-reviews-message" hidden>
                    <p>
                        You have not submitted any reviews yet.
                    </p>

                    <a href="review-form.html" class="btn-link">
                        Write Your First Review
                    </a>
                </div>
            </section>
        </main>
    </body>
</html>
