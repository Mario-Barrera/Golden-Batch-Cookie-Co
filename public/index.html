<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="description" content="Discover Golden Batch Cookie Co., serving fresh-baked homemade cookies made with classic flavors, quality ingredients, and a passion for sharing something sweet.">
  <meta name="author" content="Golden Batch Cookie Co.">

  <title>Golden Batch Cookie Co. | Home Page</title>
  
  <link rel="canonical" href="https://www.goldenbatchcookies.com/about.html">
  
  <link rel="stylesheet" type="text/css" href="css/index.css">
  <link rel="stylesheet" type="text/css" href="css/order-prompt.css">
  <link rel="stylesheet" type="text/css" href="css/user-greeting.css">
  <link rel="stylesheet" type="text/css" href="css/cart-status.css">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  
  <script src="js/navbar.js" defer></script> 
  <script src="js/user-greeting.js" defer></script>
  <script src="js/user-status.js" defer></script>
  <script src="js/order-prompt.js" defer></script>
  <script src="js/cart-status.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <img class="img-logo" src="images/Company-Logo-Color.png" alt="Golden Batch Cookie Co. logo">

      <!-- User Greeting for logged-in users -->
      <div id="user-greeting">
        <span class="user-name"></span>
        <div class="user-links">
          <a href="index.html" id="logout">Logout</a>
        </div>
      </div>

      <ul class="nav-links" aria-label="Main navigation">
          <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
          <li>
            <a id="order-online-link" href="order.html">
              <i class="fa-solid fa-cart-shopping"></i>
                Order

              <span id="cart-count-badge" class="cart-count-badge">
                0
              </span>
            </a>
          </li>
          <li><a href="catering.html"><i class="fa-solid fa-utensils"></i>Catering</a></li>
          <li><a href="about.html"><i class="fa-solid fa-circle-info"></i>About</a></li>
          <li id="account-login-item"><a href="account-login.html"><i class="fa-solid fa-circle-user"></i>Login</a></li>
          <li id="account-profile-item"><a href="account-profile.html"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
          <li><a href="reviews.html"><i class="fa-solid fa-star"></i>Customer Reviews</a></li>
      </ul>

      <div class="connect">
          <p>Connect with us</p>
          <ul class="social-links">
              <li>
                  <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Facebook"
                  >
                    <i class="fa-brands fa-facebook"></i>
                  </a>
              </li>
                    
              <li>
                  <a
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Instagram"
                  >
                    <i class="fa-brands fa-instagram"></i>
                  </a>
              </li>

              <li>
                  <a
                    href="https://twitter.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Twitter"
                  >
                    <i class="fa-brands fa-twitter"></i>
                  </a>
              </li>

              <li>
                  <a
                    href="https://www.pinterest.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Pinterest"
                  >
                    <i class="fa-brands fa-pinterest"></i>
                  </a>
              </li>
          </ul>
      </div>
    </aside>

    <div class="grid-container">
      <img src="images/Chocolate-chip-cookies-homepage.png" class="home-img1" alt="Freshly baked pumpkin pie from Yummy Pies.">
      <img src="images/Cookie-assortment-homepage.png" class="home-img2" alt="Freshly baked apple pie from Yummy Pies.">
      <img src="images/White-chocolate-macadamia-homepage.png" class="home-img3" alt="Freshly baked cherry pie from Yummy Pies.">
    </div>
  </div>
</body>
</html>
