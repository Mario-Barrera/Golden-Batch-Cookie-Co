<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Write a review for Golden Batch Cookie Co.">

    <title>Write a Review | Golden Batch Cookie Co.</title>

    <!-- Prevent search engines from indexing this private account page or following its links. -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" type="text/css" href="css/review-form.css">
    <link rel="stylesheet" type="text/css" href="css/user-greeting.css">
    <link rel="stylesheet" type="text/css" href="css/cart-status.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;600&display=swap">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="js/auth.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/user-greeting.js" defer></script>
    <script src="js/user-status.js" defer></script>
    <script src="js/cart-status.js" defer></script>
    <script src="js/review-form.js" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="img-logo" src="images/Company-Logo-Color.png" alt="Golden Batch Cookie Co. logo">

            <!-- User Greeting for logged-in users -->
            <div id="user-greeting">
                <span class="user-name"></span>
                <div class="user-links">
                    <a href="index.html" id="logout">Logout</a>
                </div>
            </div>

            <ul class="nav-links" aria-label="Main navigation">
                <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li>
                    <a id="order-online-link" href="order.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                            Order

                        <span id="cart-count-badge" class="cart-count-badge">
                            0
                        </span>
                    </a>
                </li>
                <li><a href="catering.html"><i class="fa-solid fa-utensils"></i>Catering</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i>About</a></li>
                <li id="account-login-item"><a href="account-login.html"><i class="fa-solid fa-circle-user"></i>Login</a></li>
                <li id="account-profile-item"><a href="account-profile.html"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
                <li><a href="reviews.html"><i class="fa-solid fa-star"></i>Customer Reviews</a></li>
            </ul>

            <div class="connect">
                <p>Connect with us</p>
                <ul class="social-links">
                    <li>
                        <a
                            href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Facebook"
                        >
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    
                    <li>
                        <a
                            href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Instagram"
                        >
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://twitter.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Twitter"
                        >
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://www.pinterest.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Pinterest"
                        >
                            <i class="fa-brands fa-pinterest"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="review-form-main">
            <section class="review-form-section">
                <div class="review-form-header">
                    <h1 id="review-form-title">Write a New Review</h1>

                    <p id="review-form-description">
                        Tell us what you thought about your Golden Batch cookies.
                    </p>
                </div>

                <form id="review-form">
                    <!-- Product -->
                    <div class="form-group">
                        <label for="product-select"> Product </label>

                        <select id="product-select" name="product_id" required>
                            <option value="">Select a product</option>

                            <!-- JavaScript will dynamically load products here. -->
                        </select>
                    </div>

                    <!-- Rating -->
                    <div class="form-group">
                        <label for="rating"> Rating </label>

                        <select id="rating" name="rating" required>
                            <option value="">Select a rating</option>

                            <option value="5">5 - Excellent</option>

                            <option value="4">4 - Very Good</option>

                            <option value="3">3 - Good</option>

                            <option value="2">2 - Fair</option>

                            <option value="1">1 - Poor</option>
                        </select>
                    </div>

                    <!-- Review -->
                    <div class="form-group">
                        <label for="review"> Review </label>

                        <textarea id="review" name="review" rows="7" maxlength="1000" placeholder="Write your review here..." 
                            required></textarea>

                        <p class="review-character-limit">Maximum 1000 characters</p>
                    </div>

                    <!-- Form message -->
                    <p id="review-form-message" class="review-form-message" aria-live="polite"></p>

                    <!-- Form buttons -->
                    <div class="review-form-actions">
                        <button type="submit" id="submit-review-btn">
                            Submit Review
                        </button>

                        <a href="my-reviews.html" class="cancel-review-btn"> Cancel </a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
