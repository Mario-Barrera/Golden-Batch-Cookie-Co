<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="View and manage your Golden Batch Cookie Co. profile, update account details, and review your order history.">

    <meta name="keywords" content="Golden Batch Cookie Co. profile, account settings, order history, update profile, manage account">

    <title>Golden Batch Cookie Co. | User Profile</title>

    <link rel="canonical" href="https://www.yummypies.com/account-profile.html">

    <link rel="stylesheet" type="text/css" href="css/account-profile.css">
    <link rel="stylesheet" type="text/css" href="css/user-greeting.css">
    <link rel="stylesheet" type="text/css" href="css/cart-status.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="js/auth.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/user-greeting.js" defer></script>
    <script src="js/user-status.js" defer></script>

    <script src="js/account-profile.js" defer></script>
    <script src="js/order-history.js" defer></script>
    <script src="js/reviews.js" defer></script>
    <script src="js/comments.js" defer></script>
    <script src="js/cart-status.js" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="img-logo" src="images/Company-Logo-Color.png" alt="Golden Batch Cookie Co. logo">

            <!-- User Greeting for logged-in users -->
            <div id="user-greeting">
                <span class="user-name"></span>
                <div class="user-links">
                    <a href="index.html" id="logout">Logout</a>
                </div>
            </div>

            <ul class="nav-links" aria-label="Main navigation">
                <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li>
                    <a id="order-online-link" href="order.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                            Order

                        <span id="cart-count-badge" class="cart-count-badge">
                            0
                        </span>
                    </a>
                </li>
                <li><a href="catering.html"><i class="fa-solid fa-utensils"></i>Catering</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i>About</a></li>
                <li id="account-login-item"><a href="account-login.html"><i class="fa-solid fa-circle-user"></i>Login</a></li>
                <li id="account-profile-item"><a href="account-profile.html"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
                <li><a href="reviews.html"><i class="fa-solid fa-star"></i>Customer Reviews</a></li>
            </ul>

            <div class="connect">
                <p>Connect with us</p>
                <ul class="social-links">
                    <li>
                        <a
                            href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Facebook"
                        >
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    
                    <li>
                        <a
                            href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Instagram"
                        >
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://twitter.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Twitter"
                        >
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://www.pinterest.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Pinterest"
                        >
                            <i class="fa-brands fa-pinterest"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="profile-main">
            <section class="profile-info">
                <h1 class="main-profile-heading">Your Profile</h1>
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Email:</strong> <span id="profile-email"></span></p>
                <p><strong>Phone:</strong> <span id="profile-phone"></span></p>
            </section>

            <!-- Navigation Links -->
            <nav class="profile-navigation" aria-label="Profile navigation">
                <a href="manage-profile.html" class="btn-link">Manage Profile</a>
                <a href="order.html" class="btn-link">Continue Shopping</a>
                <a href="my-reviews.html" class="btn-link">Manage My Reviews</a>
                <a href="my-comments.html" class="btn-link">Manage My Comments</a>
            </nav>
            
            <!-- Make sure the HTML element IDs or class names match those used in the frontend JS file -->
            <section class="profile-orders">
                <h2 class="heading">Order History</h2>

                <div id="profile-orderHistory" class="orders-list"></div>
                    <!-- Customer orders will be dynamically loaded here -->
            </section>

            <section class="profile-reviews-container">
                <h2 class="heading">Reviews</h2>
                
                <ul id="profile-reviews" class="reviews-list">
                    <!-- Reviews will be populated dynamically -->
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
