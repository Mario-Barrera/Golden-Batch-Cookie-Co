<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Reset your Golden Batch Cookie Co. account password.">
    <meta name="author" content="Golden Batch Cookie Co.">

    <title>Reset Password | Golden Batch Cookie Co.</title>

    <link rel="canonical" href="https://www.goldenbatchcookies.com/reset-password.html">

    <link rel="stylesheet" href="css/reset-password.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="js/auth.js" defer></script>
    <script src="js/reset-password.js" defer></script>
</head>
<body>
    <main class="reset-password-main">
        <section class="reset-password-section">
            <h1>Reset Your Password</h1>

            <p class="reset-password-instructions">
                Enter and confirm your new password below.
            </p>

            <form id="reset-password-form" class="reset-password-form" novalidate>

                <div class="form-group">
                    <label for="password">New Password:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm New Password:</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div
                    id="password-message"
                    class="password-message"
                    aria-live="polite"
                ></div>

                <button type="submit" class="reset-password-button">
                    Reset Password
                </button>

            </form>

            <p class="login-link">
                Remember your password?
                <a href="account-login.html">Return to Login</a>
            </p>

        </section>
    </main>
</body>
</html>
