<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Track and manage your Golden Batch Cookie Co. orders. View your order status, order details, and order history.">
    <meta name="keywords" content="Golden Batch Cookie Co., cookie orders, order history, track orders, order status, order details">

    <title>Golden Batch Cookie Co. | Orders</title>

    <link rel="canonical" href="https://www.goldenbatchcookies.com/order.html">

    <link rel="stylesheet" type="text/css" href="css/order.css">
    <link rel="stylesheet" type="text/css" href="css/user-greeting.css">
    <link rel="stylesheet" type="text/css" href="css/cart-status.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://js.stripe.com/v3/" defer></script>

    <script src="js/auth.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/user-status.js" defer></script>
    <script src="js/user-greeting.js" defer></script>
    <script src="js/productImages.js" defer></script>
    <script src="js/order.js" defer></script>
    <script src="js/payment.js" defer></script>
    <script src="js/cart-status.js" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="img-logo" src="images/Company-Logo-Color.png" alt="Golden Batch Cookie Co. logo">

            <!-- User Greeting for logged-in users -->
            <div id="user-greeting">
                <span class="user-name"></span>
                <div class="user-links">
                    <a href="index.html" id="logout">Logout</a>
                </div>
            </div>

            <ul class="nav-links" aria-label="Main navigation">
                <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li>
                    <a id="order-online-link" href="order.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                            Order

                        <span id="cart-count-badge" class="cart-count-badge">
                            0
                        </span>
                    </a>
                </li>
                <li><a href="catering.html"><i class="fa-solid fa-utensils"></i>Catering</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i>About</a></li>
                <li id="account-login-item"><a href="account-login.html"><i class="fa-solid fa-circle-user"></i>Login</a></li>
                <li id="account-profile-item"><a href="account-profile.html"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
                <li><a href="reviews.html"><i class="fa-solid fa-star"></i>Customer Reviews</a></li>
            </ul>

            <div class="connect">
                <p>Connect with us</p>
                <ul class="social-links">
                    <li>
                        <a
                            href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Facebook"
                        >
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </li>
                    
                    <li>
                        <a
                            href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Instagram"
                        >
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://twitter.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Twitter"
                        >
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </li>

                    <li>
                        <a
                            href="https://www.pinterest.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Pinterest"
                        >
                            <i class="fa-brands fa-pinterest"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="heading1">Build Your Cookie Box</h1>

            <div id="product-container">
                <!-- Cookie products are inserted here by order.js -->
            </div>
        </main>
        
        <aside class="order-form-panel">
            <form id="order-form">
                <h2 class="order-title">Your Order</h2>

                <div id="order-items">
                    <!-- Selected products are inserted here by order.js -->
                </div>

                <div class="order-summary">
                    <p>
                        Subtotal:
                        <span id="order-subtotal">$0.00</span>
                    </p>
                </div>

                <button type="submit" id="submit-order-btn">
                    Continue to Payment
                </button>
            </form>

            <form id="payment-form" hidden>
                <h2>Payment</h2>

                <div id="payment-order-summary"></div>

                <!-- Stripe will place the secure payment fields here -->
                <div id="payment-element"></div>

                <div id="payment-message"></div>

                <button id="back-to-order-btn" type="button">
                    Back
                </button>

                <button id="pay-now-btn" type="submit">
                    Pay & Place Order
                </button>
            </form>
        </aside>
    </div>
</body>
</html>
